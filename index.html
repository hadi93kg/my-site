<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hadi | AI & Deep Learning Developer</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#020617;
  color:#e5e7eb;
  font-family:"Times New Roman", Times, serif;
  line-height:1.8;
  overflow:hidden;
}

/* ===== NAV ===== */
nav{
  background:#01040d;
  padding:12px 20px;
  display:flex;
  gap:24px;
  align-items:center;
  position:fixed;
  top:0;
  width:100%;
  z-index:100;
  border-bottom:1px solid #1e293b;
}

nav a{
  text-decoration:none;
  color:#e5e7eb;
  font-size:16px;
  letter-spacing:1px;
}

/* ===== SECTIONS ===== */
section{
  padding:120px 40px 80px;
  max-width:1100px;
  margin:auto;
  position:relative;
  z-index:10;
}

/* ===== HIDE CAMERA ===== */
video{
  display:none;
}

/* ===== CANVAS (GESTURE LAYER) ===== */
canvas{
  position:fixed;
  top:0;
  left:0;
  z-index:1;
}
</style>
</head>

<body>

<nav>
  <a href="#home">HOME</a>
  <a href="#about">ABOUT</a>
  <a href="#projects">PROJECTS</a>
  <a href="#contact">CONTACT</a>
</nav>

<section id="home">
  <h1>Hadi Kanani</h1>
  <div class="subtitle">AI & Deep Learning Developer</div>
</section>

<section id="about">
  <h2>About Me</h2>
  <p>I am an AI and Deep Learning developer focused on building intelligent systems.</p>
</section>

<section id="projects">
  <h2>Projects</h2>
</section>

<section id="contact">
  <h2>Contact</h2>
</section>

<!-- CAMERA (HIDDEN) -->
<video id="video" autoplay playsinline></video>

<!-- GESTURE CANVAS -->
<canvas id="canvas"></canvas>

<script type="module">
import { HandLandmarker, FilesetResolver } from 
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Webcam
const stream = await navigator.mediaDevices.getUserMedia({ video: true });
video.srcObject = stream;

// AI model
const vision = await FilesetResolver.forVisionTasks(
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
);

const handLandmarker = await HandLandmarker.createFromOptions(vision, {
  baseOptions: {
    modelAssetPath:
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/hand_landmarker.task"
  },
  numHands: 1
});

async function loop(){
  const results = handLandmarker.detectForVideo(video, performance.now());
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(results.landmarks.length > 0){
    const thumb = results.landmarks[0][4];
    const index = results.landmarks[0][8];

    const dx = (thumb.x - index.x) * canvas.width;
    const dy = (thumb.y - index.y) * canvas.height;
    const dist = Math.sqrt(dx*dx + dy*dy);

    // Draw reactive circle
    ctx.beginPath();
    ctx.arc(canvas.width/2, canvas.height/2, dist, 0, Math.PI*2);
    ctx.strokeStyle = "#f97316";
    ctx.lineWidth = 4;
    ctx.stroke();
  }

  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
