<!DOCTYPE html>
<html>
<body>

<h1>Camera Test</h1>
<video id="cam" autoplay></video>

<script>
navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => {
    document.getElementById("cam").srcObject = stream;
  })
  .catch(err => {
    alert("Camera error: " + err);
  });
</script>

</body>
</html>
