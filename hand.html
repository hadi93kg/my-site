<!DOCTYPE html>
<html>
<head>
  <title>Gesture Particles</title>
  <style>
    body {
      margin:0;
      background:#020617;
      overflow:hidden;
    }
    video { display:none; }
    canvas {
      position:fixed;
      top:0;
      left:0;
    }
  </style>
</head>
<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script type="module">
import { HandLandmarker, FilesetResolver } from 
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// particles
let particles = [];
for(let i=0;i<300;i++){
  particles.push({
    angle: Math.random()*Math.PI*2,
    radius: Math.random()*200
  });
}

// webcam
const stream = await navigator.mediaDevices.getUserMedia({ video:true });
video.srcObject = stream;

// AI
const vision = await FilesetResolver.forVisionTasks(
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
);

const handLandmarker = await HandLandmarker.createFromOptions(vision,{
  baseOptions:{
    modelAssetPath:
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/hand_landmarker.task"
  },
  numHands:1
});

async function loop(){
  const results = handLandmarker.detectForVideo(video, performance.now());
  ctx.clearRect(0,0,canvas.width,canvas.height);

  let power = 50;

  if(results.landmarks.length > 0){
    const thumb = results.landmarks[0][4];
    const index = results.landmarks[0][8];
    const dx = (thumb.x-index.x)*canvas.width;
    const dy = (thumb.y-index.y)*canvas.height;
    power = Math.sqrt(dx*dx + dy*dy);
  }

  particles.forEach(p=>{
    const r = p.radius + power;
    const x = canvas.width/2 + Math.cos(p.angle)*r;
    const y = canvas.height/2 + Math.sin(p.angle)*r;

    ctx.fillStyle = "#60a5fa";
    ctx.beginPath();
    ctx.arc(x,y,2,0,Math.PI*2);
    ctx.fill();
  });

  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
