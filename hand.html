<!DOCTYPE html>
<html>
<head>
  <title>Hand Gesture</title>
  <style>
    body { margin:0; background:#020617; overflow:hidden; }
    video { position:fixed; top:10px; right:10px; width:180px; border:2px solid orange; }
    canvas { position:fixed; top:0; left:0; }
  </style>
</head>
<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// وبکم
const stream = await navigator.mediaDevices.getUserMedia({ video: true });
video.srcObject = stream;

// مدل دست
const vision = await FilesetResolver.forVisionTasks(
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
);

const handLandmarker = await HandLandmarker.createFromOptions(vision, {
  baseOptions: {
    modelAssetPath:
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/hand_landmarker.task"
  },
  numHands: 1
});

async function loop() {
  const results = handLandmarker.detectForVideo(video, performance.now());
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if (results.landmarks.length > 0) {
    const thumb = results.landmarks[0][4];
    const index = results.landmarks[0][8];

    const dx = (thumb.x - index.x) * canvas.width;
    const dy = (thumb.y - index.y) * canvas.height;
    const dist = Math.sqrt(dx*dx + dy*dy);

    ctx.beginPath();
    ctx.arc(canvas.width/2, canvas.height/2, dist, 0, Math.PI*2);
    ctx.strokeStyle = "orange";
    ctx.lineWidth = 4;
    ctx.stroke();
  }

  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
